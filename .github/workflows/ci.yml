name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OutOpen.sln

      - name: Build
        run: dotnet build OutOpen.sln -c Release --no-restore -v q

      - name: Test
        run: dotnet test tests/OutOpen.Core.Tests/OutOpen.Core.Tests.csproj -c Release --no-build -v q

      - name: CLI smoke test
        run: dotnet run --project src/OutOpen.Cli -c Release --no-build -- types
